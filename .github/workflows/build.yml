name: APK derle
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: İmza anahtarı (repoda tutulmaz; secret'tan oluşturulur)
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/release.p12
          test -s app/release.p12 || { echo "KEYSTORE_B64 secret eksik"; exit 1; }
        env: { KEYSTORE_B64: '${{ secrets.KEYSTORE_B64 }}' }
      - run: gradle assembleRelease --no-daemon
        env: { KEYSTORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}' }
      - run: cp app/build/outputs/apk/release/app-release.apk Yatirim.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Yatırım ${{ github.run_number }}
          files: Yatirim.apk
