name: Discovery integration checks
on:
  push:
    branches:
      - feature/v2-discovery-live-port
      - feature/fon-pusulasi-v2-1
  pull_request:
    branches:
      - release/fon-pusulasi-v2-live
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify discovery and existing UI tests
        run: |
          set -euo pipefail
          node tools/v2-discovery.test.js
          node tools/v2-ui.test.js
          node tools/v2-dashboard.test.js
          node tools/portfolio-engine.test.js
          node tools/production-release.test.js
          node tools/v2-1-portfolio-chart.test.js
          node tools/v2-1-realized-returns.test.js
          node tools/v2-1-score-diary.test.js
          node tools/data-quality.test.js
          node tools/quote-selection.test.js
          node tools/return-metrics.test.js
          node tools/fund-history.test.js
          node tools/twr.test.js
          node tools/external-flows.test.js
          node tools/ledger-reconcile.test.js
          node tools/legacy-trade-audit.test.js
          node tools/verified-returns.test.js
          node tools/ui-returns.test.js
          node tools/statement-ui.test.js
          node tools/statement-csv.test.js
          node tools/android-host.test.js
  android-v2-1:
    if: github.head_ref == 'feature/fon-pusulasi-v2-1' || github.ref == 'refs/heads/feature/fon-pusulasi-v2-1'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Compile isolated 2.1 Android APK
        run: gradle assembleDebug --no-daemon
      - name: Verify APK and bundled UI
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -tq "$apk" >/dev/null
          unzip -p "$apk" assets/index.html | cmp - ui/index.html
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          dir="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$dir/aapt" dump badging "$apk" | grep -q "^package: name='com.yasin.yatirimapp.preview'"
      - uses: actions/upload-artifact@v4
        with:
          name: Fon-Pusulasi-2-1-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  signed-candidate-v2-1:
    if: github.repository == 'yasinbirinci6134-sketch/Yatirim_Uygulamasi' && (github.ref == 'refs/heads/feature/fon-pusulasi-v2-1' || (github.event_name == 'pull_request' && github.head_ref == 'feature/fon-pusulasi-v2-1' && github.event.pull_request.head.repo.full_name == github.repository))
    needs: [test, android-v2-1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore original signing key for upgrade-compatible candidate
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/release.p12
          keytool -list -keystore app/release.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias yatirim >/dev/null
      - name: Build signed 2.1 candidate (no publication)
        env:
          FP_21_CANDIDATE: 'true'
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Verify original signing identity and upgrade path
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -tq "$apk" >/dev/null
          unzip -p "$apk" assets/index.html | cmp - ui/index.html
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          dir="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$dir/apksigner" verify --print-certs "$apk" > /tmp/candidate-cert.txt
          "$dir/aapt" dump badging "$apk" > /tmp/candidate-package.txt
          grep -q "^package: name='com.yasin.yatirimapp'" /tmp/candidate-package.txt
          grep -q "versionName='2.1." /tmp/candidate-package.txt
          current="$(head -1 /tmp/candidate-package.txt | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          test -n "$current" && (( current >= 210000 ))
          mkdir -p /tmp/installed
          gh release download v2.0.22 --pattern Fon-Pusulasi-2.apk --dir /tmp/installed
          prior=/tmp/installed/Fon-Pusulasi-2.apk
          "$dir/apksigner" verify --print-certs "$prior" > /tmp/installed-cert.txt
          "$dir/aapt" dump badging "$prior" > /tmp/installed-package.txt
          old="$(head -1 /tmp/installed-package.txt | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          old_cert="$(grep 'certificate SHA-256 digest:' /tmp/installed-cert.txt | head -1)"
          new_cert="$(grep 'certificate SHA-256 digest:' /tmp/candidate-cert.txt | head -1)"
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          test -n "$old" && (( current > old ))
          cp "$apk" Fon-Pusulasi-2-1-Candidate.apk
          sha256sum Fon-Pusulasi-2-1-Candidate.apk > Fon-Pusulasi-2-1-Candidate.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Fon-Pusulasi-2-1-Signed-Candidate
          path: |
            Fon-Pusulasi-2-1-Candidate.apk
            Fon-Pusulasi-2-1-Candidate.apk.sha256
          retention-days: 14
  approve-ota-v2-1:
    if: github.repository == 'yasinbirinci6134-sketch/Yatirim_Uygulamasi' && (github.ref == 'refs/heads/feature/fon-pusulasi-v2-1' || (github.event_name == 'pull_request' && github.head_ref == 'feature/fon-pusulasi-v2-1' && github.event.pull_request.head.repo.full_name == github.repository))
    needs: [test, android-v2-1, signed-candidate-v2-1]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fon-pusulasi-v2-1
          persist-credentials: true
      - name: Approve only the exact fully tested commit
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch origin feature/fon-pusulasi-v2-1
          test "$(git rev-parse origin/feature/fon-pusulasi-v2-1)" = "$VERIFIED_SHA" || { echo "A newer commit exists; do not approve stale UI"; exit 0; }
          mkdir -p .github/status
          python3 - <<'PY'
          import datetime,json,os
          with open('.github/status/v2-1-build.json','w',encoding='utf-8') as f:
            json.dump({'status':'success','source_commit':os.environ['VERIFIED_SHA'],'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat()},f,indent=2)
            f.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/status/v2-1-build.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(v2.1): approve tested OTA UI [skip ci]'
            git push origin HEAD:feature/fon-pusulasi-v2-1
          fi
