name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: font
        run: |
          mkdir -p font && cd font
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -s -A "$UA" "https://fonts.googleapis.com/css2?family=Manrope:wght@500..800&display=swap" > manrope.css
          grep -o 'https://[^)]*\.woff2' manrope.css | nl -ba | while read n u; do curl -s -o "f$n.woff2" "$u"; done
          ls -la; cd ..
          git config user.name yatirim-bot; git config user.email yatirim-bot@users.noreply.github.com
          git add -A && git commit -qm font && git push -q origin probe
