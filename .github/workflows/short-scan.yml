name: Kisa vade BIST 100 gunluk tarama

on:
  workflow_dispatch:
  schedule:
    - cron: "40 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: short-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Veri dogrulama testleri
        run: node tools/data-quality.test.js
      - name: Yeni gunluk degisim verileriyle BIST 100 taramasi
        run: node tools/short.js short.json
      - name: scan dalina yayinla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp short.json /tmp/short-scan.json
          git fetch origin scan
          git checkout -B scan origin/scan
          cp /tmp/short-scan.json short.json
          git add short.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "scan: BIST 100 kapanis verileri ve gunluk yuzdeler"
          git push origin HEAD:scan
