name: Fon Pusulasi 2.0 Test APK
on:
  push:
    branches:
      - feature/fon-pusulasi-v2-phase1
  workflow_dispatch:
# Only the newest preview commit may publish the rolling APK.
concurrency:
  group: fon-pusulasi-v2-preview
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portfolio and quote tests
        run: |
          node tools/data-quality.test.js
          node tools/quote-selection.test.js
          node tools/portfolio-engine.test.js
          node tools/return-metrics.test.js
          node tools/v2-ui.test.js
          node tools/v2-dashboard.test.js
          node tools/twr.test.js
          node tools/external-flows.test.js
          node tools/ledger-reconcile.test.js
          node tools/legacy-trade-audit.test.js
          node tools/verified-returns.test.js
          node tools/ui-returns.test.js
          node tools/statement-ui.test.js
          node tools/statement-csv.test.js
          node tools/android-host.test.js
          node tools/preview-signing.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable APK signing key from existing GitHub Secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Existing KEYSTORE_B64 and KEYSTORE_PASSWORD secrets are required; refusing a temporary signing key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/release.p12
          test -s app/release.p12
          keytool -list -keystore app/release.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias yatirim >/dev/null
      - name: Build stable-signed preview (independent from production)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assemblePreview --no-daemon
      - name: Verify APK archive and create build fingerprints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/preview/app-preview.apk
          test -s "$apk"
          unzip -tq "$apk" >/dev/null
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tools_dir="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$tools_dir/apksigner" && test -x "$tools_dir/aapt"
          "$tools_dir/apksigner" verify --verbose --print-certs "$apk" > /tmp/preview-signature.txt
          "$tools_dir/aapt" dump badging "$apk" > /tmp/preview-package.txt
          grep -q "^package: name='com.yasin.yatirimapp.preview2'" /tmp/preview-package.txt
          grep -q "certificate SHA-256 digest:" /tmp/preview-signature.txt
          printf 'signed_package=com.yasin.yatirimapp.preview2\n' > /tmp/preview-public-metadata.txt
          grep 'certificate SHA-256 digest:' /tmp/preview-signature.txt | head -1 >> /tmp/preview-public-metadata.txt
          # Refuse to replace an existing preview2 release with a different
          # signing certificate, or with a non-increasing Android versionCode.
          mkdir -p /tmp/preview-previous
          if gh release download v2-preview-current --pattern 'Fon-Pusulasi-2-Preview.apk' --dir /tmp/preview-previous --clobber >/dev/null 2>&1; then
            old=/tmp/preview-previous/Fon-Pusulasi-2-Preview.apk
            if "$tools_dir/aapt" dump badging "$old" | grep -q "^package: name='com.yasin.yatirimapp.preview2'"; then
              "$tools_dir/apksigner" verify --print-certs "$old" > /tmp/previous-signature.txt
              old_cert="$(grep 'certificate SHA-256 digest:' /tmp/previous-signature.txt | head -1)"
              new_cert="$(grep 'certificate SHA-256 digest:' /tmp/preview-signature.txt | head -1)"
              test "$old_cert" = "$new_cert" || { echo "::error::Signing certificate changed; existing installations would reject this APK."; exit 1; }
              old_code="$( "$tools_dir/aapt" dump badging "$old" | head -1 | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" )"
              new_code="$(head -1 /tmp/preview-package.txt | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
              test -n "$old_code" && test -n "$new_code" && (( 10#$new_code > 10#$old_code )) || { echo "::error::versionCode must rise for Android in-place updates."; exit 1; }
            fi
          fi
          # The bundled WebView UI must be byte-identical to this checkout.
          unzip -p "$apk" assets/index.html | cmp - ui/index.html
          test -s ui/index.html
          cp "$apk" Fon-Pusulasi-2-Preview.apk
          sha256sum Fon-Pusulasi-2-Preview.apk > Fon-Pusulasi-2-Preview.apk.sha256
          printf 'commit=%s\nrun=%s\nbranch=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_REF_NAME" > Fon-Pusulasi-2-Preview-build.txt
          cat /tmp/preview-public-metadata.txt >> Fon-Pusulasi-2-Preview-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Fon-Pusulasi-2-Preview-APK
          path: |
            Fon-Pusulasi-2-Preview.apk
            Fon-Pusulasi-2-Preview.apk.sha256
            Fon-Pusulasi-2-Preview-build.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified APK and checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview-current
          name: Fon Pusulasi 2.0 - Test APK
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            Fon-Pusulasi-2-Preview.apk
            Fon-Pusulasi-2-Preview.apk.sha256
            Fon-Pusulasi-2-Preview-build.txt
      - name: Save latest build status for repository readers
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PREVIEW_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p .github/status
          python3 - <<'PY'
          import datetime, json, os
          result = {
              'status': os.environ['PREVIEW_JOB_STATUS'],
              'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_number': int(os.environ['GITHUB_RUN_NUMBER']),
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          with open('.github/status/v2-preview-build.json', 'w', encoding='utf-8') as fh:
              json.dump(result, fh, indent=2)
              fh.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/status/v2-preview-build.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(v2): record preview build result [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
