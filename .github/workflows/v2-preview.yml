name: Fon Pusulasi 2.0 Test APK
on:
  push:
    branches:
      - feature/fon-pusulasi-v2-phase1
  workflow_dispatch:
# Only the newest preview commit may publish the rolling APK.
concurrency:
  group: fon-pusulasi-v2-preview
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portfolio and quote tests
        run: |
          node tools/data-quality.test.js
          node tools/quote-selection.test.js
          node tools/portfolio-engine.test.js
          node tools/return-metrics.test.js
          node tools/v2-ui.test.js
          node tools/v2-dashboard.test.js
          node tools/twr.test.js
          node tools/external-flows.test.js
          node tools/ledger-reconcile.test.js
          node tools/legacy-trade-audit.test.js
          node tools/verified-returns.test.js
          node tools/ui-returns.test.js
          node tools/statement-ui.test.js
          node tools/statement-csv.test.js
          node tools/android-host.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build independently installable preview
        run: gradle assembleDebug --no-daemon
      - name: Verify APK archive and create build fingerprints
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -tq "$apk" >/dev/null
          # The bundled WebView UI must be byte-identical to this checkout.
          unzip -p "$apk" assets/index.html | cmp - ui/index.html
          test -s ui/index.html
          cp "$apk" Fon-Pusulasi-2-Preview.apk
          sha256sum Fon-Pusulasi-2-Preview.apk > Fon-Pusulasi-2-Preview.apk.sha256
          printf 'commit=%s\nrun=%s\nbranch=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_REF_NAME" > Fon-Pusulasi-2-Preview-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Fon-Pusulasi-2-Preview-APK
          path: |
            Fon-Pusulasi-2-Preview.apk
            Fon-Pusulasi-2-Preview.apk.sha256
            Fon-Pusulasi-2-Preview-build.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified APK and checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview-current
          name: Fon Pusulasi 2.0 - Test APK
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            Fon-Pusulasi-2-Preview.apk
            Fon-Pusulasi-2-Preview.apk.sha256
            Fon-Pusulasi-2-Preview-build.txt
      - name: Save latest build status for repository readers
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PREVIEW_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p .github/status
          python3 - <<'PY'
          import datetime, json, os
          result = {
              'status': os.environ['PREVIEW_JOB_STATUS'],
              'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_number': int(os.environ['GITHUB_RUN_NUMBER']),
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          with open('.github/status/v2-preview-build.json', 'w', encoding='utf-8') as fh:
              json.dump(result, fh, indent=2)
              fh.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/status/v2-preview-build.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(v2): record preview build result [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
