<script>
/* Bağımsız APK: claude.ai veritabanı yerine yerel depolama + GitHub'daki yapay zekâ çıktısı */
(function(){
  let sa=false; try{ sa=!!(window.YatirimApp && YatirimApp.standalone && YatirimApp.standalone()); }catch(_){}
  if(!sa) return;
  window.__standalone=true;
  const RAW="https://raw.githubusercontent.com/yasinbirinci6134-sketch/Yatirim_Uygulamasi/data/";
  const ld=p=>{ try{ const v=localStorage.getItem("db:"+p); return v?JSON.parse(v):null; }catch(_){ return null; } };
  const sv=(p,v)=>{ try{ v==null?localStorage.removeItem("db:"+p):localStorage.setItem("db:"+p,JSON.stringify(v)); }catch(_){} };
  const subs={}, csubs={}, cp=v=>v==null?null:JSON.parse(JSON.stringify(v));
  const remote=p=>p==="market/latest"||p==="market/scorelog"||p.startsWith("market/news_");
  const snap=v=>({exists:v!=null, data:()=>cp(v)});
  /* Kişisel takip listesi yalnızca bu telefonda: genel listede yoksa boş satır olarak eklenir, fiyatı canlı çekilir */
  function withMine(m){ m=cp(m); const W=(ld("config/watchlist")||{}).codes||[], F=(ld("config/fundwatch")||{}).codes||[], X=(ld("config/fxwatch")||{}).codes||[];
    const add=(arr,codes,mk)=>codes.forEach(c=>{ const x=arr.find(i=>i.code===c); if(x) x.mine=true; else arr.push(mk(c)); });
    m.stocks=m.stocks||[]; m.funds=m.funds||[]; m.fx=m.fx||[];
    add(m.stocks,W,c=>({code:c,name:c,mine:true,local:true}));
    add(m.funds,F,c=>({code:c,name:c,cat:"diger",mine:true,local:true}));
    add(m.fx,X,c=>({code:c,name:c,cat:"doviz",mine:true,local:true}));
    return m; }
  const value=p=>{ const v=ld(p); return p==="market/latest"&&v?withMine(v):v; };
  const emit=p=>(subs[p]||[]).forEach(cb=>{ try{ cb(snap(value(p))); }catch(e){ console.error(e); } });
  const get=url=>new Promise((res,rej)=>{ let id; try{ id=YatirimApp.http("GET",url,"","{}"); }catch(e){ return rej(e); } const t0=Date.now();
    const poll=()=>{ const r=YatirimApp.take(id); if(r){ try{ const o=JSON.parse(r); o.ok?res(o.body):rej(new Error(o.error||"hata")); }catch(e){ rej(e); } return; }
      if(Date.now()-t0>30000) return rej(new Error("zaman aşımı")); setTimeout(poll,120); }; setTimeout(poll,60); });
  const file=p=>p==="market/latest"?"market.json":p==="market/scorelog"?"scorelog.json":"news/"+p.slice(12)+".json";
  async function pull(p){ try{ const v=JSON.parse(await get(RAW+file(p)+"?t="+Math.floor(Date.now()/60000)));
      if(JSON.stringify(ld(p))!==JSON.stringify(v)){ sv(p,v); emit(p); }
      if(p==="market/latest") setTimeout(()=>{ try{ liveRefresh(null,false); }catch(_){} },500); }
    catch(e){ if(/404/.test(e.message) && p.startsWith("market/news_") && ld(p)!=null){ sv(p,null); emit(p); } } }
  window.__pullRemote=()=>{ pull("market/latest"); pull("market/scorelog"); };
  const after=p=>{ if(/^config\/(watchlist|fundwatch|fxwatch)$/.test(p)){ emit("market/latest"); setTimeout(()=>{ try{ liveRefresh(null,false); }catch(_){} },400); } };
  function doc(p){ return {
    onSnapshot(cb){ (subs[p]=subs[p]||new Set()).add(cb); setTimeout(()=>cb(snap(value(p))),0); if(remote(p)) pull(p); return ()=>subs[p].delete(cb); },
    async get(){ return snap(value(p)); },
    async set(v){ sv(p,cp(v)); emit(p); after(p); },
    async update(v){ sv(p,{...(ld(p)||{}),...cp(v)}); emit(p); after(p); },
    async delete(){ sv(p,null); emit(p); after(p); } }; }
  function collection(p){ const k="col/"+p, all=()=>ld(k)||{}, qs=()=>({docs:Object.entries(all()).map(([id,d])=>({id,data:()=>cp(d)}))});
    const put=o=>{ sv(k,o); (csubs[p]||[]).forEach(cb=>{ try{ cb(qs()); }catch(e){ console.error(e); } }); };
    return {
      onSnapshot(cb){ (csubs[p]=csubs[p]||new Set()).add(cb); setTimeout(()=>cb(qs()),0); return ()=>csubs[p].delete(cb); },
      doc(id){ return { async set(v){ const o=all(); o[id]=cp(v); put(o); }, async update(v){ const o=all(); o[id]={...(o[id]||{}),...cp(v)}; put(o); }, async delete(){ const o=all(); delete o[id]; put(o); } }; },
      async add(v){ const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8); const o=all(); o[id]=cp(v); put(o); return {id}; } }; }
  window.claude={ use: async n => n==="db" ? {doc, collection} : n==="user" ? {id: async()=>"local"} : null };
})();
</script>
<script>
const CAT = {para:"Para piyasası", altin:"Altın", hisse:"Hisse", diger:"Diğer", gumus:"Gümüş", doviz:"Döviz"};
const S = { fxwatch:[], fwatch:[], pfs:[], pf:null, watch:[], market:null, trades:[], cfg:null, status:null, uid:null, tab:"oneri", db:null, mcp:null, sample:null, busy:false, ready:false };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tl = (n, d=0) => (n==null||isNaN(n)) ? "–" : n.toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d}) + " TL";
/* Rozet rengi kalem türünün kendi eşikleriyle (config/rules): hisse 60/42, fon 70/45, döviz 62/42 */
const sCls = (v,t) => v==null?"":v>=(t==="f"?70:t==="x"?62:60)?" hi":v>=(t==="f"?45:42)?" mid":" lo";
const arr = v => v==null||isNaN(v)||v==0 ? "" : v>0 ? "▲ " : "▼ ";
var S_LF = {hisse:{q:"",s:"puan",f:"all"},oneri:{q:"",s:"puan",f:"all"},doviz:{q:"",s:"puan",f:"all"}};
function applyLF(tab, a){ const f=S_LF[tab]; const q=(f.q||"").toLocaleLowerCase("tr-TR").trim();
  let out=q?a.filter(x=>(x.code+" "+(x.name||"")).toLocaleLowerCase("tr-TR").includes(q)):a;
  const ff=f.f||"all"; if(ff!=="all") out=out.filter(x=> tab==="oneri" ? (ff==="al"?x.score>=70:ff==="izle"?(x.score>=45&&x.score<70):x.score<45) : x.signal===ff);
  const key={puan:x=>-(x.score??-1),gun:x=>-(x.d1??-999),yil:x=>-(x.y1??-999),az:null}[f.s];
  if(key) out=[...out].sort((p,q2)=>key(p)-key(q2)); else if(f.s==="az") out=[...out].sort((p,q2)=>p.code.localeCompare(q2.code,"tr"));
  return out; }
function lfBar(tab, ph){ const f=S_LF[tab];
  return `<div class="lfbar"><input type="search" id="lfq-${tab}" data-lfq="${tab}" placeholder="${esc(ph||"Ara: kod ya da ad")}" value="${esc(f.q)}" autocomplete="off" aria-label="Listede ara">
    <div class="chips" role="group" aria-label="Sırala">${[["puan","Puana göre"],["gun","Günün değişimi"],["yil","1 yıl"],["az","A–Z"]].map(([k,l])=>`<button data-lfs="${tab}:${k}" aria-pressed="${f.s===k}">${l}</button>`).join("")}</div>${(()=>{ const F=tab==="oneri"?[["all","Tümü"],["al","70+ puan"],["izle","45–69"],["uzak","45 altı"]]:[["all","Tümü"],["al","Alınabilir"],["izle","İzle"],["uzak","Uzak dur"]]; return `<div class="chips fchips" role="group" aria-label="Süz">${F.map(([k,l])=>`<button data-lff="${tab}:${k}" aria-pressed="${(f.f||"all")===k}">${l}</button>`).join("")}</div>`; })()}</div>`; }
document.addEventListener("input",e=>{ const t=e.target.dataset?.lfq; if(!t) return; S_LF[t].q=e.target.value; const pos=e.target.selectionStart;
  ({hisse:renderHisse,oneri:renderOneri,doviz:renderDoviz})[t](); const el=$("lfq-"+t); if(el){ el.focus(); try{el.setSelectionRange(pos,pos)}catch(_){} } });
document.addEventListener("click",e=>{ const g=e.target.closest?.("[data-lff]"); if(g){ const [t,k]=g.dataset.lff.split(":"); S_LF[t].f=k; ({hisse:renderHisse,oneri:renderOneri,doviz:renderDoviz})[t](); return; } const b=e.target.closest?.("[data-lfs]"); if(!b) return; const [t,k]=b.dataset.lfs.split(":"); S_LF[t].s=k; ({hisse:renderHisse,oneri:renderOneri,doviz:renderDoviz})[t](); });
const pc = (n, d=2) => (n==null||isNaN(n)) ? "–" : (n>0?"+":"") + "%" + n.toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d});
const cls = n => n>0 ? "up" : n<0 ? "down" : "";
const fmtDate = s => { if(!s) return "–"; const d=new Date(s); return isNaN(d) ? esc(s) : d.toLocaleDateString("tr-TR",{day:"numeric",month:"long"}); };
const fmtTime = s => { const d=new Date(s); return isNaN(d) ? "–" : d.toLocaleString("tr-TR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); };
const asset = code => (S.market?.funds||[]).find(f => f.code===code) || (()=>{ const x=(S.market?.stocks||[]).find(f=>f.code===code); if(x) return {...x, cat:"hisse", isStock:true}; const y=(S.market?.fx||[]).find(f=>f.code===code); return y ? {...y, isFx:true} : null; })();
function toast(msg,ms){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms||2600); }

/* ---------- Açılır satırlar ---------- */
S.ok = new Set();
const xo = k => S.ok.has(k) ? " open" : "";
document.addEventListener("click", e => {
  if(e.target.closest("button,a,input,select,textarea,label,form")) return;
  const c = e.target.closest(".clamp"); if(c){ c.classList.toggle("open"); const k=c.dataset.k; c.classList.contains("open")?S.ok.add(k):S.ok.delete(k); return; }
  const x = e.target.closest(".x"); if(!x) return;
  const dk=x.dataset.k||""; if(/^[sfx]:/.test(dk) && x.classList.contains("fund")){ openDetail(dk[0], dk.slice(2)); return; }

async function autoQuick(){
  if(!AUTOQ.length || !S.mcp || !S.cfg?.lightTriggerId || pending() || S.busy) return;
  const now=Date.now(), kinds=AUTOQ.filter(k=>{ const at=S.market?.[QK[k][1]], last=Math.max(at?new Date(at).getTime():0, S.market?.updatedAt?new Date(S.market.updatedAt).getTime():0);
    if(now-last<15*60e3) return false;                       // 15 dk içinde güncellendiyse atla
    if(k==="fon") return last<fundPoint();                     // fon fiyatı günde bir kez açıklanır: son açıklamadan sonra çekildiyse atla

const STALE_MS = 30*60e3, REQ_COOLDOWN = 20*60e3;
/* Borsa İstanbul: hafta içi 10:00–18:10 (TSİ = UTC+3) */
const TR = 3*3600e3;
/* Borsa İstanbul tatilleri (kaynak: BIST 2026 takvimi) ve yarım günler (12:40 kapanış) */
const BIST_CLOSED=new Set(["2026-01-01","2026-03-20","2026-04-23","2026-05-01","2026-05-19","2026-05-27","2026-05-28","2026-05-29","2026-07-15","2026-10-29","2027-01-01"]);
const BIST_HALF=new Set(["2026-03-19","2026-05-26","2026-10-28"]);
const dayKey = t => new Date(t+TR).toISOString().slice(0,10);
const closeMin = key => BIST_HALF.has(key) ? 760 : 1090;
const isTradingDay = t => { const wd=new Date(t+TR).getUTCDay(); return wd>=1&&wd<=5&&!BIST_CLOSED.has(dayKey(t)); };
function marketOpen(){ const now=Date.now(), l=new Date(now+TR), m=l.getUTCHours()*60+l.getUTCMinutes(); return isTradingDay(now)&&m>=600&&m<closeMin(dayKey(now)); }
function lastClose(){ const now=Date.now(), l=new Date(now+TR);
  for(let i=0;i<14;i++){ const d0=Date.UTC(l.getUTCFullYear(),l.getUTCMonth(),l.getUTCDate()-i)-TR, key=dayKey(d0);
    const c=d0+closeMin(key)*60e3; if(isTradingDay(d0)&&c<=now) return c; } return 0; }
/* Fon fiyatları işlem günü geç akşam yayımlanır (20:30'da çoğu hâlâ önceki gündü); 22:00'yi açıklama anı say */
function fundPoint(){ const now=Date.now(), l=new Date(now+TR);
  for(let i=0;i<14;i++){ const d0=Date.UTC(l.getUTCFullYear(),l.getUTCMonth(),l.getUTCDate()-i)-TR, c=d0+1320*60e3; if(isTradingDay(d0)&&c<=now) return c; } return 0; }
function upToDate(){ const u=S.market?.updatedAt; return !marketOpen() && !!u && new Date(u).getTime()>=lastClose(); }
function updatedToday(){ const u=S.market?.updatedAt; return !!u && new Date(u).toDateString()===new Date().toDateString(); }
function ageMs(){ return S.market?.updatedAt ? Date.now()-new Date(S.market.updatedAt).getTime() : Infinity; }
function pending(){ const r=S.status?.requestedAt; if(!r || Date.now()-new Date(r).getTime() >= REQ_COOLDOWN) return false;
  const o=S.status?.only, u = o==="__qa__" ? (()=>{ const ts=(S.status?.kinds||[]).map(k=>S.market?.[QK[k]?.[1]]); return ts.some(t=>!t)?null:ts.sort()[0]; })() : o==="__scan__" ? S.market?.fundScan?.at : o==="__qs__" ? S.market?.quickStocksAt : o==="__qf__" ? S.market?.quickFundsAt : o==="__qx__" ? S.market?.quickFxAt : o ? asset(o)?.updatedAt : S.market?.updatedAt; return !u || new Date(u) < new Date(r); }
const EST0={scan:230,full:290,one:85,fullscan:480,qs:70,qf:110,qx:70};
const QK={hisse:["__qs__","quickStocksAt","HIZLI: HISSE","qs","Hisse fiyatları"],fon:["__qf__","quickFundsAt","HIZLI: FON","qf","Fon fiyatları"],doviz:["__qx__","quickFxAt","HIZLI: DOVIZ","qx","Döviz ve altın"]};

  if(S._pw){ const d=(Date.now()-new Date(S._pw.at).getTime())/1000; if(d>20 && d<1800){ const o=durs(); (o[S._pw.k]=o[S._pw.k]||[]).push(Math.round(d)); o[S._pw.k]=o[S._pw.k].slice(-8); try{localStorage.setItem("fp-dur",JSON.stringify(o))}catch(_){} } S._pw=null; }

  dot.className = ageMs()<STALE_MS ? "dot ok" : "dot";
  txt.textContent = "Veriler: " + fmtTime(S.market.updatedAt) + (upToDate() ? (BIST_CLOSED.has(dayKey(Date.now()))?" · Bugün borsa tatil, veriler güncel":" · Piyasa kapalı, veriler güncel") : "");

function donut(mix){ const C={para:"var(--para)",altin:"var(--gold)",hisse:"var(--stock)",gumus:"#8a8f98",doviz:"#6b5aa6",diger:"var(--muted)"};
  const R=15.915, L=100; let off=25;
  const seg=mix.map(m=>{ const d=`<circle r="${R}" cx="21" cy="21" fill="none" stroke="${C[m.c]||"var(--muted)"}" stroke-width="6" stroke-dasharray="${m.w} ${L-m.w}" stroke-dashoffset="${off}"/>`; off-=m.w; return d; }).join("");
  return `<svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Portföy dağılımı"><circle r="${R}" cx="21" cy="21" fill="none" stroke="var(--line)" stroke-width="6"/>${seg}</svg>`; }
function allocBlock(h){
  if(h?.items?.length && MYB.length){ const ok=h.items.filter(it=>{const f=asset(it.code); return !f||f.isStock||isMine(f);}); const t=ok.reduce((s,i)=>s+Number(i.weight||0),0);
    if(ok.length<h.items.length){ let acc=0; h={...h, items:ok.map((it,i)=>{ const w=i===ok.length-1?100-acc:Math.round(Number(it.weight)/t*100); acc+=w; return {...it,weight:w}; })}; } }
  if(!h?.items?.length) return "";
  const allStock=h.items.every(it=>asset(it.code)?.isStock);
  const col=(it,i)=>{ const f=asset(it.code), cat=f?.cat||it.cat||"para"; return allStock ? `background:color-mix(in srgb,var(--stock) ${100-i*13}%,var(--card))` : ""; };
  const cl=it=>{ const f=asset(it.code); return "bar-"+esc(f?.cat||it.cat||"para"); };
  const bars = h.items.map((it,i) => `<i class="${allStock?"":cl(it)}" style="width:${Number(it.weight)||0}%;${col(it,i)}"></i>`).join("");
  const rows = h.items.map((it,i) => { const f=asset(it.code); const cat=f?.cat||it.cat||"para";
    const k="a:"+(h.title||"")+it.code;
    return `<div class="aitem x${xo(k)}" data-k="${esc(k)}"><span class="adot xh ${allStock?"":cl(it)}" style="${col(it,i)}"></span>
      <div class="xh amid"><span class="code">${esc(it.code)}</span> <span class="name">${esc(f?.name||CAT[cat]||"")}</span></div>
      <span class="pct num xh">%${esc(it.weight)}</span>
      <p class="why">${esc(it.why)}</p></div>`; }).join("");
  return `<section class="card"><div class="horizon"><h2>${esc(h.title)}</h2><span class="small muted">${esc(h.horizon||"")}</span></div>
    <div class="alloc" aria-hidden="true">${bars}</div><div>${rows}</div></section>`;
}

async function ask(){
  const q=$("askIn").value.trim(), out=$("askOut"), btn=$("askBtn"); if(!q||!S.sample) return;
  btn.disabled=true; out.hidden=false; out.textContent="Düşünüyor…";
  const ctx = { tarih:new Date().toISOString().slice(0,10), piyasa:S.market, sanalPortfoy:portfolioRows().map(r=>({kod:r.code,yatirilan:r.amount,simdikiDeger:Math.round(r.value),karZarar:Math.round(r.pnl)})) };
  const prompt = `Türkiye'de yaşayan bireysel bir yatırımcıya Türkçe, kısa ve net yanıt ver (en fazla 8 cümle ya da kısa madde). Yalnızca aşağıdaki güncel verilere dayan; veride olmayan fiyat ya da haber uydurma. Belirli fon kodları ve yüzdeli dağılım önerebilirsin, gerekçesini bir cümleyle ver. Yanıtın sonunda tek satırla bunun bir görüş olduğunu, garanti olmadığını belirt.\n\nVERİ:\n${JSON.stringify(ctx)}\n\nSORU: ${q}`;
  try{ const r = await S.sample(prompt,{modelTier:"default", cache:false, onText:({text})=>{ out.textContent=text; }}); out.textContent=r.text; }
  catch(e){ out.textContent = e?.code==="not_granted" ? "Soru sorma izni verilmedi." : e?.code==="rate_limited" ? "Çok sık soruldu, biraz sonra tekrar dene." : "Yanıt alınamadı."; }
  finally{ btn.disabled=false; }
}

  const c=b.dataset.refresh, x=asset(c);
  if(pending()){ toast("Bir güncelleme zaten sürüyor, bitince tekrar dene."); return; }
  const isF=(S.market?.fx||[]).some(f=>f.code===c) ? "fx" : !!(S.market?.funds||[]).some(f=>f.code===c);
  if(x && itemFresh(x)){ askConfirm(`${closedNote()} ve ${c} verisi son kapanıştan sonra çekildi. Yine de güncellemek ister misin?`, ()=>requestRefresh(true, c, isF, true)); return; }
  requestRefresh(true, c, isF); }); }
const num = (n,d=2) => (n==null||isNaN(n)) ? "–" : Number(n).toLocaleString("tr-TR",{maximumFractionDigits:d});
function perfBlock(x){
  const P=[["w1","1 hafta"],["m1","1 ay"],["m3","3 ay"],["m6","6 ay"],["ytd","Yıl başı"],["y1","1 yıl"]].filter(([k])=>typeof x[k]==="number");
  if(!P.length) return "";
  const mx=Math.max(...P.map(([k])=>Math.abs(x[k])),1);
  return `<div class="perf" role="img" aria-label="Dönemsel getiri">${P.map(([k,l])=>{const v=x[k],w=Math.abs(v)/mx*50;
    return `<span>${l}</span><span class="track"><i class="${v>=0?"p":"n"}" style="width:${w}%"></i></span><span class="v num ${cls(v)}">${pc(v,1)}</span>`}).join("")}</div>`;
}
function partsBlock(parts){ if(!parts) return "";

const NOTE={deger:["fiyatı ucuz","fiyatı pahalı"],karlilik:["kârlı","kârlılığı zayıf"],saglamlik:["şirket sağlam","yapısı riskli"],momentum:["yükselişte","son aylarda zayıf"],analist:["analistler olumlu","analist desteği az"],
 getiri:["getirisi istikrarlı","getirisi zayıf"],maliyet:["ücreti düşük","ücreti yüksek"],risk:["az dalgalanır","çok dalgalanır"],kalite:["büyük ve köklü","küçük fon"],uyum:["ortam destekliyor","ortam desteklemiyor"],

function scoreNote(x){ const p=x?.parts; if(!p) return "";
  const r=Object.entries(p).filter(([k,v])=>NOTE[k]&&typeof v==="number").map(([k,v])=>[k,v/(Number(S.market?.partsMax?.[k])||PMX[k])]).sort((a,b)=>b[1]-a[1]);
  if(!r.length) return ""; const g=r.filter(([,v])=>v>=0.7).slice(0,2).map(([k])=>NOTE[k][0]), z=r.filter(([,v])=>v<=0.4).slice(-2).reverse().map(([k])=>NOTE[k][1]);
  const t=[g.length?"Artı: "+g.join(", "):"", z.length?"Eksi: "+z.join(", "):""].filter(Boolean).join(" · ");
  return t?`<p class="snote">${esc(t)}</p>`:""; }
const dAge = s => s ? (Date.now()-new Date(s).getTime())/864e5 : 99;

function histBlock(code){ const h=(S.hist||{})[code]; if(!h||h.length<2) return "";
  const v=h.map(p=>p.sc), mn=Math.min(...v), mx=Math.max(...v), W=240, H=40, rg=Math.max(mx-mn,4), lo=mn-(rg-(mx-mn))/2;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H-4-(y-lo)/rg*(H-8)).toFixed(1)}`).join(" ");
  const a=v[0], b=v[v.length-1], d=b-a;
  return `<div class="hist"><div class="small muted">Puan geçmişi · ${esc(fmtDate(h[0].d))}'dan beri <b class="${d>0?"up":d<0?"down":""}">${num(a,0)} → ${num(b,0)}</b></div>

function curPf(){ return S.pfs.find(p=>p.id===S.pf) || S.pfs[0] || null; }
function pfTrades(pf){ if(!pf) return []; return S.trades.filter(t => t.pf===pf.id || (!t.pf && pf.legacy)); }
function daysSince(d){ const t=new Date(d+"T00:00:00"); return isNaN(t) ? null : Math.max(0, Math.round((Date.now()-t.getTime())/864e5)); }
function portfolioRows(pf){
  pf = pf || curPf();
  return pfTrades(pf).filter(t=>t.status!=="closed").map(t => {
    const f=asset(t.code), cur = f?.price ?? t.price, units = t.units || t.amount/t.price, value=units*cur;
    return {...t, units, cur, value, pnl:value-t.amount, pnlPct:(cur/t.price-1)*100, d1:f?.d1, curDate:f?.priceDate, days:daysSince(t.buyDate||t.priceDate)};
  });
}
function groupRows(rows){ const m=new Map();
  rows.forEach(r=>{ const g=m.get(r.code)||{code:r.code,lots:[],amount:0,value:0,units:0}; g.lots.push(r); g.amount+=r.amount; g.value+=r.value; g.units+=r.units; m.set(r.code,g); });
  return [...m.values()].map(g=>{ g.lots.sort((a,b)=>String(a.buyDate||a.priceDate).localeCompare(String(b.buyDate||b.priceDate)));
    g.cur=g.lots[0].cur; g.price=g.units?g.amount/g.units:g.lots[0].price; g.pnl=g.value-g.amount; g.pnlPct=g.amount?(g.value/g.amount-1)*100:0;
    g.days=Math.max(...g.lots.map(l=>l.days||0)); g.buyDate=g.lots[0].buyDate; return g; }).sort((a,b)=>b.value-a.value); }
function advise(r, total){
  const a=asset(r.code); if(!a) return ["kal","Kal","Güncel veri yok."];
  if(a.isFx){ const sc=a.score!=null?` (puan ${num(a.score,0)})`:"";
    if(a.signal==="uzak") return ["cik","Azalt",`Analiz 'Uzak dur' diyor${sc}; TL faiz getirisinin gerisinde kalabilir.`];
    if(r.pnlPct>=20 && a.signal!=="al") return ["kar","Kısmen kâr al",`%${num(r.pnlPct,0)} kârdasın ve sinyal 'İzle'.`];
    if(a.signal==="al") return ["ekle","Kal, eklenebilir","'Alınabilir'"+sc+"."];
    return ["kal","Kal","Sinyal 'İzle'"+sc+"; koruma amaçlı tutulabilir."]; }
  if(a.isStock){
    const sig=a.signal, sc=a.score!=null?` (puan ${num(a.score,0)})`:"";
    if(sig==="uzak") return ["cik","Çık","Analiz 'Uzak dur' diyor"+sc+": "+(a.why||"")];
    if(r.pnlPct<=-15 && sig!=="al") return ["cik","Çık","Zarar %15'i geçti ve hisse güçlü görünmüyor; zararı sınırlamak mantıklı."];
    if(r.pnlPct>=30 && sig!=="al") return ["kar","Kısmen kâr al",`%${num(r.pnlPct,0)} kârdasın ve sinyal 'İzle'; bir kısmını satıp kârı kilitle.`];
    if(sig==="al") return ["ekle","Kal, eklenebilir","'Alınabilir'"+sc+"; düşüşlerde parça parça eklenebilir."];
    return ["kal","Kal","Sinyal 'İzle'"+sc+"; yeni alım için daha iyi fiyat bekle."];
  }
  const adv=S.market?.advice, find=h=>(adv?.[h]?.items||[]).find(i=>i.code===r.code);
  const s=find("short"), l=find("long"), w=total? r.value/total*100 : 0, sc=a.score;
  if(!s && !l && sc!=null && sc<50) return ["cik","Çık",`Önerilerde yok ve puanı düşük (${num(sc,0)}/100); daha yüksek puanlı bir fona geçilebilir.`];
  if(s && w < s.weight-10) return ["ekle","Ekle",`Kısa vadede %${s.weight} öneriliyor, portföyünde %${num(w,0)}.`];
  if(s && w > s.weight+20 && !l) return ["kar","Azalt",`Kısa vadede %${s.weight} öneriliyor, portföyünde %${num(w,0)}; fazlası başka fona kaydırılabilir.`];
  if(!s && l) return ["kal","Kal (uzun vade)",`Kısa vadede önerilmiyor ama uzun vadede %${l.weight} payı var; aceleye gerek yok.`];
  return ["kal","Kal", s ? `Önerilen dağılımda (%${s.weight}).` : "Belirgin bir değişiklik sinyali yok."];
}

             <div class="lots" style="grid-column:1/-1">${g.lots.map(r=>`<div class="lot"><div style="display:flex;justify-content:space-between;gap:8px"><b class="num small">${fmtDate(r.buyDate||r.priceDate)}</b><span class="num small ${cls(r.pnl)}">${r.pnl>=0?"+":""}${tl(r.pnl)} (${pc(r.pnlPct)})</span></div>${lotLine(r,1)}${acts(r)}</div>`).join("")}</div>`}

function bindPf(pf){
  document.querySelectorAll("[data-pfsel]").forEach(b=>b.onclick=()=>{ S.pf=b.dataset.pfsel; try{localStorage.setItem("fp-pf",S.pf)}catch(_){}; renderSanal(); });
  const pk=$("pfPick"); if(pk) pk.onclick=()=>{ S.pfOpen=!S.pfOpen; $("pfMgr").classList.toggle("closed",!S.pfOpen); pk.setAttribute("aria-expanded",S.pfOpen); };
  $("pfSel").onchange = e => { S.pf=e.target.value; try{localStorage.setItem("fp-pf",S.pf)}catch(_){}; renderSanal(); };
  let mode="new";
  $("pfNew").onclick = () => { mode="new"; $("pfForm").hidden=false; $("pfName").value=""; $("pfName").focus(); };
  if($("pfRen")) $("pfRen").onclick = () => { mode="ren"; $("pfForm").hidden=false; $("pfName").value=pf.name; $("pfName").focus(); };
  if($("pfDel")) $("pfDel").onclick = () => { $("pfDelBox").hidden=false; };
  if($("pfDelNo")) $("pfDelNo").onclick = () => { $("pfDelBox").hidden=true; };
  if($("pfDelYes")) $("pfDelYes").onclick = async () => {
    try{ for(const t of pfTrades(pf)) await tradesCol().doc(t.id).delete(); await tradesCol().doc(pf.id).delete(); S.pf=null; toast("Portföy silindi"); }catch(e){ toast("Silinemedi."); } };
  $("pfForm").onsubmit = async e => { e.preventDefault(); const n=$("pfName").value.trim(); if(!n) return;
    try{ if(mode==="ren"){ await tradesCol().doc(pf.id).update({name:n}); }
      else { const ref=await tradesCol().add({kind:"portfolio",name:n,createdAt:new Date().toISOString(),legacy:S.pfs.length===0}); S.pf=ref.id; try{localStorage.setItem("fp-pf",S.pf)}catch(_){} }
      $("pfForm").hidden=true; }catch(err){ toast("Kaydedilemedi."); } };
}
async function askPf(pf, rows, total){
  const out=$("pfAskOut"), btn=$("pfAsk"); btn.disabled=true; out.hidden=false; out.textContent="Değerlendiriliyor…";
  const pos=rows.map(r=>{ const a=asset(r.code); return {kod:r.code, alisTarihi:r.buyDate||r.priceDate, gun:r.days, yatirilan:Math.round(r.amount), deger:Math.round(r.value), karZararYuzde:+r.pnlPct.toFixed(2), portfoyPayi:+(r.value/total*100).toFixed(1), puan:a?.score, sinyal:a?.signal, risk:a?.risk, kural:advise(r,total)[1]}; });
  const prompt=`Türkiye'de bireysel yatırımcının "${pf.name}" portföyünü değerlendir. Türkçe, kısa: önce 1–2 cümle genel durum, sonra her pozisyon için tek satır "KOD: Kal / Ekle / Azalt / Çık – gerekçe", sonunda varsa eksik olan (ör. çeşitlendirme) tek cümle. Yalnızca aşağıdaki verilere dayan, fiyat ya da haber uydurma.\n\nPİYASA: ${JSON.stringify({gostergeler:S.market?.indicators, fonOnerisi:S.market?.advice?.short, hisseOnerisi:S.market?.advice?.stocks?.short})}\n\nPORTFÖY: ${JSON.stringify(pos)}`;
  try{ const r=await S.sample(prompt,{modelTier:"default",cache:false,onText:({text})=>{out.textContent=text;}}); out.textContent=r.text; }
  catch(e){ out.textContent = e?.code==="not_granted" ? "Değerlendirme izni verilmedi." : "Değerlendirme alınamadı."; }
  finally{ btn.disabled=false; }
}
function tradesCol(){ return S.db.collection("data/users/"+S.uid); }
async function sell(id){
  const t=S.trades.find(x=>x.id===id), f=asset(t?.code); if(!t||!f) return;
  try{ await tradesCol().doc(id).update({status:"closed", sellPrice:f.price, sellDate:f.priceDate}); toast(`${t.code} satıldı olarak kaydedildi`); }
  catch(e){ toast("Kaydedilemedi."); }
}
async function delTrade(id){ try{ await tradesCol().doc(id).delete(); }catch(e){ toast("Silinemedi."); } }

function planBase(amount, types, vade){
  const A=S.market.advice||{}, out=[];
  const parts=[]; if(types.fon) parts.push((vade==="kisa"?A.short:A.long)?.items||[]); if(types.hisse) parts.push((vade==="kisa"?A.stocks?.short:A.stocks?.long)?.items||[]);
  const share=amount/parts.length;
  parts.forEach(items=>{ const ok=items.filter(it=>{const a=asset(it.code); return a && (a.isStock||akVis(a));}); const tot=ok.reduce((s,i)=>s+Number(i.weight||0),0)||1;
    ok.forEach(it=>out.push({code:it.code, tl:share*Number(it.weight)/tot, why:it.why})); });
  return out;
}

/*SCORE:BEGIN — fiyata bağlı puan parçaları; uygulama canlı fiyatla, yapay zekâ günlük güncellemede aynı kodla hesaplar (tools/score.js) */
const SCORE={

  num:v=>typeof v==="number"&&isFinite(v),
  MAX:{deger:20,karlilik:30,saglamlik:15,momentum:25,analist:10,getiri:30,maliyet:20,risk:25,kalite:15,uyum:10,tasima:25,trend:30,fxdeger:15,makro:20,fxrisk:10},
  /* Hisse momentum (0–25): 12-1 ay getirisi ve 3 ay getirisi BIST 100'e göre; aylık aralıktaki yer. m3<0 ve y1<0 → en çok 5; m3 < −%20 → en çok 12; 1 ayda +%25 sıçrama tek başına puan getirmez. */

    const s1=SCORE.clamp(0.5+r121/0.6), s2=SCORE.clamp(0.5+r3/0.3);

    let pos=x.mHigh>x.mLow&&x.price>0?SCORE.clamp((x.price-x.mLow)/(x.mHigh-x.mLow)):(x.low1y>0&&x.high1y>x.low1y&&x.price>0?SCORE.clamp((x.price-x.low1y)/(x.high1y-x.low1y)):0.5);
    if(x.m1>25) pos=Math.min(pos,0.5);
    let v=(0.45*s1+0.40*s2+0.15*pos)*mx;
    if(x.m3<0&&x.y1<0) v=Math.min(v,5/25*mx);
    if(x.m3<-20) v=Math.min(v,12/25*mx);
    return Math.round(v); },

    const r121=(1+x.y1/100)/(1+x.m1/100)-(1+MM.y1/100)/(1+MM.m1/100), s1=SCORE.clamp(0.5+r121/0.4);

  }

    const tiles=[tile("BIST 100",I("BIST 100")?.v,nchg(I("BIST 100")?.note)), tile("Dolar/TL",I("Dolar/TL")?.v,nchg(I("Dolar/TL")?.note),"USD","x"),
      tile("Gram altın",I("Gram altın")?.v,nchg(I("Gram altın")?.note),"GAU","x"), fxp("EUR")?tile("Euro/TL",num(fxp("EUR").price,2),fxp("EUR").d1,"EUR","x"):"",
      re!=null?`<div class="hm-tile"><span class="k g" data-g="Reel faiz">Reel faiz</span><span class="v num ${re>=0?"up":"down"}">${re>=0?"+":""}%${re.toLocaleString("tr-TR",{maximumFractionDigits:1})}</span><span class="hm-chg muted">${re>=0?"TL'de kazandırıyor":"TL eriyor"}</span></div>`:"",
      tile("Politika faizi",I("Politika faizi")?.v,null)].join("");
    // dikkat: elindekilerde çıkış uyarısı, uzak dur ya da sert düşüş
    const held=[...new Set(open.map(t=>t.code))], watch=[...new Set([...S.watch,...S.fwatch,...S.fxwatch])];
    const al=[...held,...watch.filter(c=>!held.includes(c))].map(c=>({c,t:typeOf(c),x:asset(c),h:held.includes(c)})).filter(o=>o.x).map(o=>{ const x=o.x;
      const why=x.exitAt?"Listeden çıkabilir: "+String(x.exitWhy||"puanı düştü"):x.signal==="uzak"?"Puanı zayıf ("+num(x.score,0)+"), uzak durulması öneriliyor":typeof x.d1==="number"&&x.d1<=-3?"Bugün sert düştü ("+pc(x.d1,1)+")":typeof x.d1==="number"&&x.d1>=4?"Bugün sert yükseldi ("+pc(x.d1,1)+")":null;
      return why?{...o,why}:null; }).filter(Boolean).slice(0,5);
    const alHtml=al.length?`<div class="hm-sec"><h2>Dikkat</h2></div><section class="card" style="padding-block:6px">${al.map(o=>`<div class="hm-row" data-od="${o.t}:${o.c}"><span class="hm-dot" style="background:${/sert yüksel/.test(o.why)?"var(--up)":"var(--down)"}"></span><div class="hg"><b>${esc(o.c)}${o.h?' <span class="small muted">· elinde</span>':""}</b><span>${esc(o.why)}</span></div><span class="muted">›</span></div>`).join("")}</section>`:"";
    // görünüm kartları
    const mini=(k,t,tab)=>t?`<div class="hm-mini" data-tab="${tab}"><span class="k">${k}</span><p>${esc(clean(t))}</p><span class="go">Listeye git ›</span></div>`:"";
    const twoHtml=(a.stocks?.summary||a.fx?.summary)?`<div class="hm-two">${mini("Hisse görünümü",a.stocks?.summary,"hisse")}${mini("Döviz ve altın",a.fx?.summary,"doviz")}</div>`:"";
    // takvim
    const cal=(a.watch||[]).map(w=>{ const i=w.indexOf(": "); const d=i>0&&i<24?w.slice(0,i):"", t=i>0&&i<24?w.slice(i+1).trim():w; return `<div class="hm-ev"><span class="d">${esc(d||"Yakında")}</span><p>${esc(t)}</p></div>`; }).join("");
    // haberler
    const news=m.news||[], showAll=S._allNews;
    const nrow=(n,i)=>`<div class="hm-row" data-nw="${i}"><span class="hm-dot" style="background:${n.impact==="yuksek"?"var(--down)":n.impact==="dusuk"?"var(--line)":"var(--warn)"}"></span><div class="hg"><b style="white-space:normal">${esc(n.title)}</b><span>${esc(fmtDate(n.date)||"")}${n.source?" · "+esc(n.source):""}${(n.affects||[]).length?" · "+n.affects.map(f=>(NEF[f.effect]||NEF.mixed)[0].split(" ")[0]+" "+(NCAT[f.cat]||f.cat).split(" ")[0]).join(", "):""}</span></div><span class="muted">›</span></div>`;
    v.innerHTML=`<div class="hm"><div class="hm-hi">${greet()} · ${new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"})}</div>
      ${pfHtml}${doHtml}
      <div class="hm-sec"><h2>Piyasa</h2><span class="small muted">${S.live?.at?"canlı · "+esc(fmtTime(S.live.at)):""}</span></div><div class="hm-tiles">${tiles}</div>
      ${alHtml}${twoHtml}
      ${cal?`<div class="hm-sec"><h2>Takvim</h2></div><div class="hm-cal">${cal}</div>`:""}
      ${news.length?`<div class="hm-sec"><h2>Haberler</h2>${news.length>4?`<button id="hmAllN">${showAll?"Daha az":"Tümü ("+news.length+")"}</button>`:""}</div><section class="card" style="padding-block:6px">${news.slice(0,showAll?99:4).map(nrow).join("")}</section>`:""}
    </div>`;
    const go=tab=>{ S.tab=tab; showTab(); window.scrollTo({top:0}); };
    $("hmPf")?.addEventListener("click",()=>go("sanal")); $("hmPfAdd")?.addEventListener("click",()=>go("sanal")); $("hmPlan")?.addEventListener("click",()=>go("oneri"));
    $("hmAllN")?.addEventListener("click",()=>{ S._allNews=!S._allNews; renderGundem(); });
    v.querySelectorAll("[data-od]").forEach(e=>e.addEventListener("click",()=>{ const [t,c]=e.dataset.od.split(":"); if(t&&c&&detItem(t,c)) openDetail(t,c); }));
    v.querySelectorAll("[data-tab]").forEach(e=>e.addEventListener("click",()=>go(e.dataset.tab)));
    v.querySelectorAll("[data-nw]").forEach(e=>e.addEventListener("click",()=>openNews(news[+e.dataset.nw])));
  };
  { const h1=document.querySelector(".brand h1"); if(h1) h1.textContent=TITLE[S.tab]||"Bugün"; }
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ window.__pullRemote?.(); apkCheck(false); } });
  setInterval(()=>{ if(!document.hidden&&S.ready&&S.market&&LIVE.ok()) liveRefresh(null,false); },60e3);   // açıkken: borsa açıksa 5 dk'da bir
  // Veri bu katman yüklenmeden gelmiş olabilir: yeni görünümle (puan halkası, Bugün ekranı) hemen yeniden çiz
  try{ if(S.market) renderAll(); }catch(e){ console.error(e); }
  renderFresh(); setTimeout(()=>apkCheck(false),4000);
  try{ A.ready&&A.ready(); }catch(_){}
}
</script>
</body></html>
