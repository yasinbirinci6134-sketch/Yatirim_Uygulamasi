<title>Yatırım Tavsiyesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}
html,body{overscroll-behavior:none} body{margin:0}
/* Tek sütun, telefon öncelikli: üstte tazelik şeridi, sekmeler, altta kartlar */
:root{
  --bg:#F2F4F1; --card:#FFFFFF; --ink:#13211C; --muted:#5D6B66; --line:#D9E0DB;
  --accent:#0F6B57; --accent-soft:#E2EFEA; --para:#1A8A70; --gold:#A8731A; --gold-soft:#F5EBD8;
  --stock:#3D5A9E; --stock-soft:#E4E9F5; --up:#17794A; --down:#B1352C; --warn:#9A6A12;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --card:#16201D; --ink:#E4ECE8; --muted:#94A39D; --line:#25332F;
  --accent:#43B898; --accent-soft:#183A31; --para:#43B898; --gold:#D8A445; --gold-soft:#3A2F17;
  --stock:#8FA9E6; --stock-soft:#1E2A45; --up:#4FC585; --down:#E8736A; --warn:#E0B04E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --card:#16201D; --ink:#E4ECE8; --muted:#94A39D; --line:#25332F;
  --accent:#43B898; --accent-soft:#183A31; --para:#43B898; --gold:#D8A445; --gold-soft:#3A2F17;
  --stock:#8FA9E6; --stock-soft:#1E2A45; --up:#4FC585; --down:#E8736A; --warn:#E0B04E; color-scheme:dark}
:root[data-accent="mavi"]{--accent:#2F5BB7;--accent-soft:#E3EAF8}
:root[data-accent="mor"]{--accent:#6B46B0;--accent-soft:#EEE8F8}
:root[data-accent="turuncu"]{--accent:#B5541C;--accent-soft:#F8E8DD}
:root[data-accent="gri"]{--accent:#3E4A52;--accent-soft:#E6EAEC}
:root[data-theme="dark"][data-accent="mavi"]{--accent:#7FA2F0;--accent-soft:#1C2A47}
:root[data-theme="dark"][data-accent="mor"]{--accent:#B49AF0;--accent-soft:#2C2142}
:root[data-theme="dark"][data-accent="turuncu"]{--accent:#F0995E;--accent-soft:#3F2617}
:root[data-theme="dark"][data-accent="gri"]{--accent:#A9B6BE;--accent-soft:#263036}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"])[data-accent="mavi"]{--accent:#7FA2F0;--accent-soft:#1C2A47}
:root:not([data-theme="light"])[data-accent="mor"]{--accent:#B49AF0;--accent-soft:#2C2142}
:root:not([data-theme="light"])[data-accent="turuncu"]{--accent:#F0995E;--accent-soft:#3F2617}
:root:not([data-theme="light"])[data-accent="gri"]{--accent:#A9B6BE;--accent-soft:#263036}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-block:0 48px;display:flex;flex-direction:column;gap:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:20px 8px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font:700 26px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.fresh{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--up)} .dot.busy{background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:600 12.5px var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:9px 4px;border-radius:9px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--card)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font:700 19px/1.2 var(--f-display);margin:0}
h3{font:600 13px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.summary{font-size:15.5px;line-height:1.55;margin:0}
.horizon{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.alloc i{display:block;height:100%}
.alloc-row{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.pct{font:500 15px var(--f-num);min-width:44px}
.why{font-size:14px;color:var(--muted);margin:0}
.code{font:600 14px var(--f-body)}
.chip{display:inline-block;font:600 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.c-para{background:var(--accent-soft);color:var(--accent)} .c-altin{background:var(--gold-soft);color:var(--gold)} .c-hisse{background:var(--stock-soft);color:var(--stock)}
.bar-diger{background:var(--muted)} .c-diger{background:var(--line);color:var(--ink)}
.bar-para{background:var(--para)} .bar-altin{background:var(--gold)} .bar-hisse{background:var(--stock)} .bar-gumus{background:#8a8f98} .bar-doviz{background:#6b5aa6}
.c-gumus{background:#e9eaec;color:#5b6068} .c-doviz{background:#ece8f6;color:#5b4b96}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.ind{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ind div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.ind b{font:500 17px var(--f-num)}
.ind span{font-size:12px;color:var(--muted)}
.fund{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding-block:12px;border-top:1px solid var(--line)}
.fund:first-of-type{border-top:0;padding-top:0}
.fund .name{font-size:13px;color:var(--muted);min-width:0}
.fund .right{text-align:right}
.rets{grid-column:1/-1;display:flex;gap:14px;font-size:12.5px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--card);font:600 14px var(--f-body);padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px;margin-left:auto}
.btn:disabled{opacity:.5;cursor:default}
.total{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.total b{font:500 26px var(--f-num)}
.trade{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding-block:12px;border-top:1px solid var(--line)}
.trade:first-of-type{border-top:0;padding-top:0}
.trade .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.sheet{position:fixed;inset:auto 0 0;z-index:20;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  box-shadow:0 -10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19}
input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:16px var(--f-body)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:5px 12px;font:500 13px var(--f-num);cursor:pointer}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.answer{white-space:pre-wrap;font-size:14.5px;margin:0}
.note{font-size:12.5px;color:var(--muted);margin:0}
a{color:var(--accent)}
.sig{display:inline-block;font:600 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.sig-al{color:var(--up)} .sig-izle{color:var(--warn)} .sig-uzak{color:var(--down)}
.risk{display:inline-flex;gap:2px;align-items:center;font-size:12px;color:var(--muted)}
.risk i{width:6px;height:10px;border-radius:2px;background:var(--line)} .risk i.on{background:var(--ink)}
.alloc i + i{border-left:2px solid var(--card)}
.addrow{display:flex;gap:8px} .addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;font:16px var(--f-body);text-transform:uppercase}
.stock .why{grid-column:1/-1}

<script>
/* Bağımsız APK: claude.ai veritabanı yerine yerel depolama + GitHub'daki yapay zekâ çıktısı */
(function(){
  let sa=false; try{ sa=!!(window.YatirimApp && YatirimApp.standalone && YatirimApp.standalone()); }catch(_){}
  if(!sa) return;
  window.__standalone=true;
  const RAW="https://raw.githubusercontent.com/yasinbirinci6134-sketch/Yatirim_Uygulamasi/data/";
  const ld=p=>{ try{ const v=localStorage.getItem("db:"+p); return v?JSON.parse(v):null; }catch(_){ return null; } };
  const sv=(p,v)=>{ try{ v==null?localStorage.removeItem("db:"+p):localStorage.setItem("db:"+p,JSON.stringify(v)); }catch(_){} };
  const subs={}, csubs={}, cp=v=>v==null?null:JSON.parse(JSON.stringify(v));
  const remote=p=>p==="market/latest"||p==="market/scorelog"||p.startsWith("market/news_");
  const snap=v=>({exists:v!=null, data:()=>cp(v)});
  /* Kişisel takip listesi yalnızca bu telefonda: genel listede yoksa boş satır olarak eklenir, fiyatı canlı çekilir */
  function withMine(m){ m=cp(m); const W=(ld("config/watchlist")||{}).codes||[], F=(ld("config/fundwatch")||{}).codes||[], X=(ld("config/fxwatch")||{}).codes||[];
    const add=(arr,codes,mk)=>codes.forEach(c=>{ const x=arr.find(i=>i.code===c); if(x) x.mine=true; else arr.push(mk(c)); });
    m.stocks=m.stocks||[]; m.funds=m.funds||[]; m.fx=m.fx||[];
    add(m.stocks,W,c=>({code:c,name:c,mine:true,local:true}));
    add(m.funds,F,c=>({code:c,name:c,cat:"diger",mine:true,local:true}));
    add(m.fx,X,c=>({code:c,name:c,cat:"doviz",mine:true,local:true}));
    return m; }
  const value=p=>{ const v=ld(p); return p==="market/latest"&&v?withMine(v):v; };
  const emit=p=>(subs[p]||[]).forEach(cb=>{ try{ cb(snap(value(p))); }catch(e){ console.error(e); } });
  const get=url=>new Promise((res,rej)=>{ let id; try{ id=YatirimApp.http("GET",url,"","{}"); }catch(e){ return rej(e); } const t0=Date.now();
    const poll=()=>{ const r=YatirimApp.take(id); if(r){ try{ const o=JSON.parse(r); o.ok?res(o.body):rej(new Error(o.error||"hata")); }catch(e){ rej(e); } return; }
      if(Date.now()-t0>30000) return rej(new Error("zaman aşımı")); setTimeout(poll,120); }; setTimeout(poll,60); });
  const file=p=>p==="market/latest"?"market.json":p==="market/scorelog"?"scorelog.json":"news/"+p.slice(12)+".json";
  async function pull(p){ try{ const v=JSON.parse(await get(RAW+file(p)+"?t="+Math.floor(Date.now()/60000)));
      if(JSON.stringify(ld(p))!==JSON.stringify(v)){ sv(p,v); emit(p); }
      if(p==="market/latest") setTimeout(()=>{ try{ liveRefresh(null,false); }catch(_){} },500); }
    catch(e){ if(/404/.test(e.message) && p.startsWith("market/news_") && ld(p)!=null){ sv(p,null); emit(p); } } }
  window.__pullRemote=()=>{ pull("market/latest"); pull("market/scorelog"); };
  const after=p=>{ if(/^config\/(watchlist|fundwatch|fxwatch)$/.test(p)){ emit("market/latest"); setTimeout(()=>{ try{ liveRefresh(null,false); }catch(_){} },400); } };
  function doc(p){ return {
    onSnapshot(cb){ (subs[p]=subs[p]||new Set()).add(cb); setTimeout(()=>cb(snap(value(p))),0); if(remote(p)) pull(p); return ()=>subs[p].delete(cb); },
    async get(){ return snap(value(p)); },
    async set(v){ sv(p,cp(v)); emit(p); after(p); },
    async update(v){ sv(p,{...(ld(p)||{}),...cp(v)}); emit(p); after(p); },
    async delete(){ sv(p,null); emit(p); after(p); } }; }
  function collection(p){ const k="col/"+p, all=()=>ld(k)||{}, qs=()=>({docs:Object.entries(all()).map(([id,d])=>({id,data:()=>cp(d)}))});
    const put=o=>{ sv(k,o); (csubs[p]||[]).forEach(cb=>{ try{ cb(qs()); }catch(e){ console.error(e); } }); };
    return {
      onSnapshot(cb){ (csubs[p]=csubs[p]||new Set()).add(cb); setTimeout(()=>cb(qs()),0); return ()=>csubs[p].delete(cb); },
      doc(id){ return { async set(v){ const o=all(); o[id]=cp(v); put(o); }, async update(v){ const o=all(); o[id]={...(o[id]||{}),...cp(v)}; put(o); }, async delete(){ const o=all(); delete o[id]; put(o); } }; },
      async add(v){ const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8); const o=all(); o[id]=cp(v); put(o); return {id}; } }; }
  window.claude={ use: async n => n==="db" ? {doc, collection} : n==="user" ? {id: async()=>"local"} : null };
})();
</script>

const BIST_CLOSED=new Set(["2026-01-01","2026-03-20","2026-04-23","2026-05-01","2026-05-19","2026-05-27","2026-05-28","2026-05-29","2026-07-15","2026-10-29","2027-01-01"]);

const closeMin = key => BIST_HALF.has(key) ? 760 : 1090;
const isTradingDay = t => { const wd=new Date(t+TR).getUTCDay(); return wd>=1&&wd<=5&&!BIST_CLOSED.has(dayKey(t)); };
function marketOpen(){ const now=Date.now(), l=new Date(now+TR), m=l.getUTCHours()*60+l.getUTCMinutes(); return isTradingDay(now)&&m>=600&&m<closeMin(dayKey(now)); }
function lastClose(){ const now=Date.now(), l=new Date(now+TR);
  for(let i=0;i<14;i++){ const d0=Date.UTC(l.getUTCFullYear(),l.getUTCMonth(),l.getUTCDate()-i)-TR, key=dayKey(d0);
    const c=d0+closeMin(key)*60e3; if(isTradingDay(d0)&&c<=now) return c; } return 0; }
/* Fon fiyatları işlem günü geç akşam yayımlanır (20:30'da çoğu hâlâ önceki gündü); 22:00'yi açıklama anı say */

  for(let i=0;i<14;i++){ const d0=Date.UTC(l.getUTCFullYear(),l.getUTCMonth(),l.getUTCDate()-i)-TR, c=d0+1320*60e3; if(isTradingDay(d0)&&c<=now) return c; } return 0; }

  if(S._pw){ const d=(Date.now()-new Date(S._pw.at).getTime())/1000; if(d>20 && d<1800){ const o=durs(); (o[S._pw.k]=o[S._pw.k]||[]).push(Math.round(d)); o[S._pw.k]=o[S._pw.k].slice(-8); try{localStorage.setItem("fp-dur",JSON.stringify(o))}catch(_){} } S._pw=null; }

function curPf(){ return S.pfs.find(p=>p.id===S.pf) || S.pfs[0] || null; }
function pfTrades(pf){ if(!pf) return []; return S.trades.filter(t => t.pf===pf.id || (!t.pf && pf.legacy)); }
function daysSince(d){ const t=new Date(d+"T00:00:00"); return isNaN(t) ? null : Math.max(0, Math.round((Date.now()-t.getTime())/864e5)); }
function portfolioRows(pf){
  pf = pf || curPf();
  return pfTrades(pf).filter(t=>t.status!=="closed").map(t => {
    const f=asset(t.code), cur = f?.price ?? t.price, units = t.units || t.amount/t.price, value=units*cur;
    return {...t, units, cur, value, pnl:value-t.amount, pnlPct:(cur/t.price-1)*100, d1:f?.d1, curDate:f?.priceDate, days:daysSince(t.buyDate||t.priceDate)};
  });
}
function groupRows(rows){ const m=new Map();
  rows.forEach(r=>{ const g=m.get(r.code)||{code:r.code,lots:[],amount:0,value:0,units:0}; g.lots.push(r); g.amount+=r.amount; g.value+=r.value; g.units+=r.units; m.set(r.code,g); });
  return [...m.values()].map(g=>{ g.lots.sort((a,b)=>String(a.buyDate||a.priceDate).localeCompare(String(b.buyDate||b.priceDate)));
    g.cur=g.lots[0].cur; g.price=g.units?g.amount/g.units:g.lots[0].price; g.pnl=g.value-g.amount; g.pnlPct=g.amount?(g.value/g.amount-1)*100:0;
    g.days=Math.max(...g.lots.map(l=>l.days||0)); g.buyDate=g.lots[0].buyDate; return g; }).sort((a,b)=>b.value-a.value); }
function advise(r, total){
  const a=asset(r.code); if(!a) return ["kal","Kal","Güncel veri yok."];
  if(a.isFx){ const sc=a.score!=null?` (puan ${num(a.score,0)})`:"";
    if(a.signal==="uzak") return ["cik","Azalt",`Analiz 'Uzak dur' diyor${sc}; TL faiz getirisinin gerisinde kalabilir.`];
    if(r.pnlPct>=20 && a.signal!=="al") return ["kar","Kısmen kâr al",`%${num(r.pnlPct,0)} kârdasın ve sinyal 'İzle'.`];
    if(a.signal==="al") return ["ekle","Kal, eklenebilir","'Alınabilir'"+sc+"."];
    return ["kal","Kal","Sinyal 'İzle'"+sc+"; koruma amaçlı tutulabilir."]; }
  if(a.isStock){
    const sig=a.signal, sc=a.score!=null?` (puan ${num(a.score,0)})`:"";
    if(sig==="uzak") return ["cik","Çık","Analiz 'Uzak dur' diyor"+sc+": "+(a.why||"")];
    if(r.pnlPct<=-15 && sig!=="al") return ["cik","Çık","Zarar %15'i geçti ve hisse güçlü görünmüyor; zararı sınırlamak mantıklı."];
    if(r.pnlPct>=30 && sig!=="al") return ["kar","Kısmen kâr al",`%${num(r.pnlPct,0)} kârdasın ve sinyal 'İzle'; bir kısmını satıp kârı kilitle.`];
    if(sig==="al") return ["ekle","Kal, eklenebilir","'Alınabilir'"+sc+"; düşüşlerde parça parça eklenebilir."];
    return ["kal","Kal","Sinyal 'İzle'"+sc+"; yeni alım için daha iyi fiyat bekle."];
  }
  const adv=S.market?.advice, find=h=>(adv?.[h]?.items||[]).find(i=>i.code===r.code);
  const s=find("short"), l=find("long"), w=total? r.value/total*100 : 0, sc=a.score;
  if(!s && !l && sc!=null && sc<50) return ["cik","Çık",`Önerilerde yok ve puanı düşük (${num(sc,0)}/100); daha yüksek puanlı bir fona geçilebilir.`];
  if(s && w < s.weight-10) return ["ekle","Ekle",`Kısa vadede %${s.weight} öneriliyor, portföyünde %${num(w,0)}.`];
  if(s && w > s.weight+20 && !l) return ["kar","Azalt",`Kısa vadede %${s.weight} öneriliyor, portföyünde %${num(w,0)}; fazlası başka fona kaydırılabilir.`];
  if(!s && l) return ["kal","Kal (uzun vade)",`Kısa vadede önerilmiyor ama uzun vadede %${l.weight} payı var; aceleye gerek yok.`];
  return ["kal","Kal", s ? `Önerilen dağılımda (%${s.weight}).` : "Belirgin bir değişiklik sinyali yok."];
}

async function askPf(pf, rows, total){
  const out=$("pfAskOut"), btn=$("pfAsk"); btn.disabled=true; out.hidden=false; out.textContent="Değerlendiriliyor…";

function planBase(amount, types, vade){
  const A=S.market.advice||{}, out=[];
  const parts=[]; if(types.fon) parts.push((vade==="kisa"?A.short:A.long)?.items||[]); if(types.hisse) parts.push((vade==="kisa"?A.stocks?.short:A.stocks?.long)?.items||[]);
  const share=amount/parts.length;
  parts.forEach(items=>{ const ok=items.filter(it=>{const a=asset(it.code); return a && (a.isStock||akVis(a));}); const tot=ok.reduce((s,i)=>s+Number(i.weight||0),0)||1;
    ok.forEach(it=>out.push({code:it.code, tl:share*Number(it.weight)/tot, why:it.why})); });
  return out;
}

    const prompt=`Türkiye'de bireysel bir yatırımcının portföyü için karar veriyorsun. Yalnızca aşağıdaki verilere dayan; listede olmayan kod önerme, sayı uydurma. Stopaj (para piyasası/altın/diğer fonlarda kazancın %17,5'i, hisse yoğun fonlarda %0) ve kısa sürede al-sat maliyetini dikkate al: gereksiz satış önerme.
1) Elindeki her pozisyon için karar: "kal", "ekle", "azalt", "kar" (kısmen kâr al) ya da "cik"; tek cümle gerekçe (kuralOnerisi bir ipucudur, katılmıyorsan nedenini yaz).
2) eklenecekTutar > 0 ise piyasa koşuluna karar ver: "yatir", "kademeli" ya da "bekle" ("bekle"de çoğunu para piyasası fonunda park et ya da cash'e yaz). Tutarı yalnızca yeniParaTurleri'nden dağıt; mevcut portföyle birlikte dengeli bir dağılım hedefle (elindekine ekleme de yapabilirsin); tek hisse ≤%20, tek sektör ≤%40; "uzak" sinyalli ya da m3<0 ve y1<0 hisseyi kısa vadede önerme; piyasa trendi zayıfsa (BIST 100 1 yıl getirisi enflasyonun altında ve 3 ay eksi) hisse payını sınırla; belirsizlikte kademeli alım öner; aynı türde puan farkı ≤5 olan fonlar arasında geçiş önerme. eklenecekTutar 0 ise items boş, verdict mevcut portföy için genel durum ("yatir"=iyi gidiyor/koru, "kademeli"=bazı düzeltmeler gerek, "bekle"=riskli, savunmaya geç).

/* Önerilen dağılımlar telefonda, güncel puanlarla ve kurallarla kurulur (yorum metinleri günlük analizden kalır).

function buildAdvice(M){ const n=v=>typeof v==="number"&&isFinite(v), F=S.live?.fin||{};

  const rate=pf(ind("Politika faizi")), infl=pf(ind("Yıllık enflasyon"))??pf(ind("Beklenen enflasyon (12 ay)")), realPos=rate!=null&&infl!=null?rate>infl:true;

/*SHORT:BEGIN — kısa vade puanı (2–4 hafta). Geçmiş testte (BIST 100, 2017–2026) işe yarayan göstergeler: 1 yıllık yükseliş (son ay hariç),

/*SCORE:BEGIN — fiyata bağlı puan parçaları; uygulama canlı fiyatla, yapay zekâ günlük güncellemede aynı kodla hesaplar (tools/score.js) */
const SCORE={
  clamp:(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),
  num:v=>typeof v==="number"&&isFinite(v),
  MAX:{deger:20,karlilik:30,saglamlik:15,momentum:25,analist:10,getiri:30,maliyet:20,risk:25,kalite:15,uyum:10,tasima:25,trend:30,fxdeger:15,makro:20,fxrisk:10},
  /* Hisse momentum (0–25): 12-1 ay getirisi ve 3 ay getirisi BIST 100'e göre; aylık aralıktaki yer. m3<0 ve y1<0 → en çok 5; m3 < −%20 → en çok 12; 1 ayda +%25 sıçrama tek başına puan getirmez. */
  momentum(x,B,mx){ const n=SCORE.num; if(!n(x.m1)||!n(x.m3)||!n(x.y1)||!B||!n(B.m1)||!n(B.m3)||!n(B.y1)) return null;
    const r121=(1+x.y1/100)/(1+x.m1/100)-(1+B.y1/100)/(1+B.m1/100), r3=(x.m3-B.m3)/100;
    const s1=SCORE.clamp(0.5+r121/0.6), s2=SCORE.clamp(0.5+r3/0.3);
    // aylık aralıktaki yer (mLow/mHigh: son 1 ayın en düşük/en yüksek fiyatı); yoksa 1 yıllık aralık
    let pos=x.mHigh>x.mLow&&x.price>0?SCORE.clamp((x.price-x.mLow)/(x.mHigh-x.mLow)):(x.low1y>0&&x.high1y>x.low1y&&x.price>0?SCORE.clamp((x.price-x.low1y)/(x.high1y-x.low1y)):0.5);

  /* Analist (0–10): hedef fiyat potansiyelinin yarısı ≥%20 → 6, %10–20 → 4, %0–10 → 2, negatif 0, hedef yok 5; yapay zekânın revizyon/KAP düzeltmesi korunur, yalnız fiyatın etkisi güncellenir. */

      <section class="card"><h3 style="margin-top:0">Nasıl kullanılır?</h3>
        <p class="why">Kısa vade puanı (0–100) mutlak bir not değil, sıralamadır: hissenin son aylardaki gidişini BIST 100'deki diğer hisselerle karşılaştırır. Bu yüzden piyasa ne durumda olursa olsun en iyiler 90'ların üstünde çıkar; ne zaman girileceğini piyasanın durumu söyler. Karşılaştırılanlar: son 1 yılda piyasadan güçlü mü, uzun vadeli ortalamasının üstünde mi, 1 yıllık fiyat aralığının neresinde, ne kadar dalgalı. 80 ve üstü en iyi %20'dir.</p>
        <p class="why"><b>Kural:</b> Birikiminin küçük bir kısmıyla (en fazla %10) gir, en fazla 1 ay tut, aldığın fiyattan %8 düşerse sat. Piyasa düşüş eğilimindeyken girme.</p>
        <p class="why"><b>Geçmişte nasıl çalıştı (2017–2026):</b> Puanı 80 ve üstü olan hisseler sonraki 1 ayda BIST 100'ü ortalama %0,3 ile %1,7 arasında geçti; puanı 20'nin altındakiler geride kaldı. Ama tek tek işlemlerin yaklaşık yarısı yine endeksin gerisinde kaldı; piyasa düşüşteyken avantaj neredeyse yoktu. Bir olasılıktır, garanti değildir.</p></section>`; }
  // Listede olmayan hisse: aynı detay ekranı; fiyat geçmişi, bilanço ve analist verisi çekilip puan aynı formülle hesaplanır
  // Listede olmayan hisse için kalem: tarama verisiyle hemen, fiyat geçmişi/bilanço/analist arkadan (önceden de çekilir)
  function scanItem(code){ S.scanItems=S.scanItems||[]; let x=S.scanItems.find(z=>z.code===code); if(x) return x; const it=SH.d?.items.find(i=>i.code===code);
    x={code,name:it?.name||code,price:it?.price,priceDate:it?.date,local:true,scan:true,m1:typeof it?.f?.r21==="number"?lr(it.f.r21*100,1):null,m3:typeof it?.f?.r63==="number"?lr(it.f.r63*100,1):null}; S.scanItems.push(x); return x; }
  async function loadScanItem(code){ const x=scanItem(code); if(x._loaded||x._loading) return x._loading||x; x._loading=(async()=>{
      try{ const o=await lyahoo(code+".IS"); const b=lbuild(o,2); if(b) Object.assign(x,b); if(!x.name||x.name===code) x.name=o?.name||x.name; }catch(_){}
      if(S.det?.c===code) drawDetail();
      try{ const [f,a]=await Promise.all([lfin(code).catch(()=>null),lanalyst(code).catch(()=>null)]); if(S.live){ S.live.fin=S.live.fin||{}; S.live.an=S.live.an||{}; if(f) S.live.fin[code]=f; if(a) S.live.an[code]=a; }
        formulaScore({...S.market,stocks:[...(S.market?.stocks||[]).map(s=>({...s})),x]}); }catch(e){ console.error(e); }
      x._loaded=true; x._loading=null; if(SH.cache) delete SH.cache[code]; if(S.det?.c===code) drawDetail(); return x; })(); return x._loading; }
  async function openScanDetail(code){ if((S.market?.stocks||[]).some(x=>x.code===code)){ openDetail("s",code); return; } scanItem(code); openDetail("s",code); loadScanItem(code); }
  // kısa vade listesindekileri arka planda önceden yükle (açınca anında dolu gelsin)
  let pfQ=[], pfBusy=false; function prefetchScan(codes){ const L=(S.market?.stocks||[]).map(x=>x.code); codes.filter(c=>!L.includes(c)&&!pfQ.includes(c)&&!(S.scanItems||[]).some(z=>z.code===c&&(z._loaded||z._loading))).forEach(c=>pfQ.push(c));
    if(pfBusy||!pfQ.length||!LIVE.ok()) return; pfBusy=true; setTimeout(async()=>{ while(pfQ.length){ const c=pfQ.shift(); try{ await loadScanItem(c); }catch(_){} await new Promise(r=>setTimeout(r,300)); } pfBusy=false; },800); }
  const bindSt=v=>v.querySelectorAll("[data-st]").forEach(e=>e.addEventListener("click",()=>openScanDetail(e.dataset.st)));
  { const o=renderHisse; renderHisse=function(){ const v=$("v-hisse"); if(!v) return o.apply(this,arguments);
      const seg=`<div class="seg hseg" role="tablist">${[["uzun","Uzun vade"],["kisa","Kısa vade"]].map(([k,l])=>`<button data-hm="${k}" class="${(S.hmode||"uzun")===k?"on":""}" aria-selected="${(S.hmode||"uzun")===k}">${l}</button>`).join("")}</div>`;
      let r; if((S.hmode||"uzun")!=="kisa"){ r=o.apply(this,arguments); v.insertAdjacentHTML("afterbegin",seg); } else { v.innerHTML=seg+`<div class="st-view">${shortView()}</div>`; bindSt(v); prefetchScan((SH.d?.items||[]).filter(i=>i.score>=80).slice(0,15).map(i=>i.code)); }
      v.querySelectorAll("[data-hm]").forEach(b=>b.onclick=()=>{ S.hmode=b.dataset.hm; try{ localStorage.setItem("fp-hmode",S.hmode); }catch(_){} renderHisse(); }); return r; };
    try{ S.hmode=localStorage.getItem("fp-hmode")||"uzun"; }catch(_){} }
  { const o=renderGundem; renderGundem=function(){ const r=o.apply(this,arguments); const card=document.querySelector("#v-gundem .hm-do"); if(!card) return r;
      const gm=S.gmode||"uzun"; card.querySelector(".t")?.insertAdjacentHTML("beforeend",`<div class="seg hseg sm" role="tablist">${[["uzun","Uzun"],["kisa","Kısa"]].map(([k,l])=>`<button data-gm="${k}" class="${gm===k?"on":""}">${l}</button>`).join("")}</div>`);
      if(gm==="kisa"){ const t=card.querySelector(".t"); [...card.children].forEach(ch=>{ if(ch!==t) ch.remove(); }); const mk=stMarket(), d=SH.d;
        const top=d?d.items.slice(0,3):[];
        card.insertAdjacentHTML("beforeend",!d?`<p class="muted">Kısa vade listesi yükleniyor…</p>`:`${mk?`<div class="hm-step"><b>${mk.up?"↑":"↓"}</b><span>${mk.up?"Piyasa yükseliş eğiliminde; kısa vadeli alım için ortam uygun.":"Piyasa düşüş eğiliminde; şu an kısa vadeli alım önerilmiyor. Aşağıdakiler, piyasa toparlanınca ilk bakılacaklar."}</span></div>`:""}
          <div>${top.map(it=>`<div class="hm-row" data-st="${esc(it.code)}"><div style="--p:${it.score}" class="sbadge${stCls(it.score)}">${it.score}</div><div class="hg"><b>${esc(it.code)} <span style="display:inline;font-weight:500;color:var(--muted)">${esc(it.name||"")}</span></b><span>${esc((it.tags||[]).join(" · "))}</span></div>${typeof it.f?.r21==="number"?`<span class="num small ${cls(it.f.r21*100)}">1 ay ${pc(it.f.r21*100,1)}</span>`:""}</div>`).join("")}</div>
          <p class="small muted" style="margin:0">Kural: küçük tutarla gir, en fazla 1 ay tut, %8 düşerse sat.</p>
          <button class="btn ghost" id="hmShort" style="flex:none">Kısa vade listesini gör</button>`);
        bindSt(card); prefetchScan(top.map(i=>i.code)); card.querySelector("#hmShort")?.addEventListener("click",()=>{ S.hmode="kisa"; S.tab="hisse"; showTab(); renderHisse(); window.scrollTo({top:0}); }); }
      card.querySelectorAll("[data-gm]").forEach(b=>b.onclick=()=>{ S.gmode=b.dataset.gm; renderGundem(); });
      if(S.market){ window.__bootOff&&window.__bootOff(); clearTimeout(window.__bootT); window.__bootT=setTimeout(saveBoot,1500); } return r; }; }
  function saveBoot(){ try{ if(S.tab!=="gundem"||S.det||!S.market) return; const bd=document.body.cloneNode(true);
      bd.querySelectorAll("script,style,link,[hidden],#det,.scrim,.sheet,.toast,.upbar,#bootshot,#gtip").forEach(e=>e.remove());
      const html=bd.innerHTML.replace(/\sid="[^"]*"/g,""); if(html.length>150000) return;
      const css=[...document.querySelectorAll("style:not(#bootcss)")].map(s=>s.textContent).join("\n");
      const cs=getComputedStyle(document.body); const attr={}; for(const a of document.documentElement.attributes) if(a.name.startsWith("data-")) attr[a.name]=a.value; localStorage.setItem("fp-boot",JSON.stringify({v:1,attr,pad:cs.padding,font:cs.font,cls:document.documentElement.className.replace(/\bscrolled\b/,"").trim(),css,html})); }catch(_){} }
  setTimeout(()=>window.__bootOff&&window.__bootOff(),4000);
  // Detay > Puan: kısa vade puanı
  { const o=drawDetail; drawDetail=function(){ const r=o.apply(this,arguments); try{ if(S.det?.t==="s"&&S.det.tab==="puan"){ const x=detItem("s",S.det.c), s=x&&shortFor(x.code,x), c=document.querySelector("#det .dwrap > section.card"); if(x?.scan&&c) c.insertAdjacentHTML("afterbegin",`<p class=\"small muted\" style=\"margin:0 0 8px\">${x._loaded?"Bu hisse listende değil. Takibe alırsan her gün izlenir.":"Veriler yükleniyor…"}</p>`);
        if(s&&c) c.insertAdjacentHTML("beforeend",`<div class="st-det"><div style="--p:${s.score}" class="sbadge${stCls(s.score)}">${s.score}</div><div><b>Kısa vade puanı</b> <span class="small muted">(BIST 100 içindeki sırası)</span><div class="small muted">${s.score>=80?"Kısa vadede güçlü (en iyi %20)":s.score<20?"Kısa vadede zayıf (en kötü %20)":"Kısa vadede ortalama"}${stMarket()&&!stMarket().up&&s.score>=80?"; piyasa düşüşte, şimdilik alım önerilmez":""}${(s.tags||[]).length?" · "+esc(s.tags.join(" · ")):""}</div></div></div>`); } }catch(e){ console.error(e); } return r; }; }
  { const st=document.createElement("style"); st.textContent=`.hseg{margin:0 0 12px} .hseg.sm{margin:0 0 0 auto;flex:none;padding:3px} .hseg.sm button{padding:6px 10px;font-size:12.5px}
    .st-mk{border-left:4px solid var(--up)} .st-mk.down{border-left-color:var(--down)} .st-mk b{font:800 16px var(--f-display)} .st-mk p{margin:6px 0 0;color:var(--muted)}
    .st-tags{font:500 12.5px var(--f-body);color:var(--muted);margin-top:3px} .st-row{cursor:pointer}
    .st-det{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)} .st-det .sbadge,.hm-do .sbadge{flex:none}
    .nsheet .dlist .drow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}`; document.head.appendChild(st); }
  shortRefresh().catch(()=>{});
  // Geri tuşu: açık pencere (ayarlar, alarm, haber vb.) varsa önce onu kapatsın
  { let pushed=false; window.__popSheet=false;
    new MutationObserver(()=>{ const open=!!document.querySelector(".sheet");
      if(open&&!pushed){ pushed=true; try{ history.pushState({sheet:1},""); }catch(_){} }
      else if(!open&&pushed){ pushed=false; if(!window.__popSheet){ try{ if(history.state?.sheet) history.back(); }catch(_){} } window.__popSheet=false; } }).observe(document.body,{childList:true});
    window.addEventListener("popstate",e=>{ const sh=document.querySelectorAll(".sheet"); if(!pushed||!sh.length) return; window.__popSheet=true; e.stopImmediatePropagation();
      const sc=document.querySelectorAll(".scrim"); if(sc.length) sc[sc.length-1].click(); if(document.querySelector(".sheet")){ sh[sh.length-1].remove(); sc[sc.length-1]?.remove(); } },true); }
  // güncelleme sonrası açık sekmeye dön
  try{ const r=JSON.parse(localStorage.getItem("fp-restore")||"null"); if(r){ localStorage.removeItem("fp-restore"); if(Date.now()-r.at<60e3){ if(r.hmode) S.hmode=r.hmode; if(r.gmode) S.gmode=r.gmode; if(r.tab&&r.tab!==S.tab){ S.tab=r.tab; showTab(); } setTimeout(()=>window.scrollTo(0,r.y||0),400); setTimeout(()=>toast("Uygulama güncellendi"),600); } } }catch(_){}
  // Veri bu katman yüklenmeden gelmiş olabilir: yeni görünümle (puan halkası, Bugün ekranı) hemen yeniden çiz
  try{ if(S.market) renderAll(); }catch(e){ console.error(e); }
  renderFresh(); setTimeout(()=>apkCheck(false),4000);
  try{ A.ready&&A.ready(); }catch(_){}
}
